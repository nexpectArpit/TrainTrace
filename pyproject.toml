[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Exported notebook cells share globals in sequence, so individual template
# files deliberately reference names defined by earlier cells.
"backend/notebook_templates/*.py" = ["F401", "F821"]
